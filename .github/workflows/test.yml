name: tests

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      collect_logs:
        description: 'When to collect Docker logs'
        required: false
        default: 'on-failure'
        type: choice
        options:
          - 'on-failure'
          - 'always'
          - 'never'

jobs:
  setup:
    name: Setup & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: packages/*/dist
          include-hidden-files: true
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Run linter
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unit

  docker-build:
    name: Docker Build (odoo-mcp)
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/odoo-mcp/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/marcfargas/odoo-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-tests:
    name: Integration Tests (Odoo 17)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Run integration tests
        env:
          # Testcontainers manages containers automatically — no manual Docker needed
          TESTCONTAINERS_RYUK_DISABLED: 'false'
          DEBUG: 'odoo-mcp:*'
        run: npm run test:integration

      - name: Collect container logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ===" 
          docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" || true
          echo ""
          echo "=== Recent container logs ==="
          for cid in $(docker ps -aq --filter "ancestor=odoo:17.0" 2>/dev/null); do
            echo "--- Odoo container $cid ---"
            docker logs --tail 100 "$cid" 2>&1 || true
          done
          for cid in $(docker ps -aq --filter "ancestor=postgres:15-alpine" 2>/dev/null); do
            echo "--- PostgreSQL container $cid ---"
            docker logs --tail 50 "$cid" 2>&1 || true
          done

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            odoo.log
            postgres.log
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: integration

  testcontainers-package:
    name: Testcontainers Package Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Run odoo-testcontainers tests
        run: npx vitest run --config packages/odoo-testcontainers/vitest.config.ts packages/odoo-testcontainers/tests/

  validate-skill-spec:
    name: Validate SKILL.md Files
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate SKILL.md (Agent Skills spec)
        run: |
          pip install skills-ref
          set -e
          for skill_md in $(find skills -name SKILL.md); do
            skill_dir=$(dirname "$skill_md")
            echo "Validating $skill_dir..."
            agentskills validate "$skill_dir"
          done
          echo "All SKILL.md files valid ✅"

  validate-github-repo-path:
    name: Validate skills add (GitHub repo)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install skills tooling
        run: pip install skills-ref

      - name: Test discovery
        run: |
          set -e
          OUTPUT=$(npx -y skills add . --list 2>&1) || true
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "odoo"; then
            echo "  ✅ odoo skill detected"
          else
            echo "  ❌ odoo skill NOT detected"
            exit 1
          fi

      - name: Test installation
        run: |
          set -e
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.pi/agent"

          OUTPUT=$(npx -y skills add . --all 2>&1) || {
            echo "❌ skills add from repo failed:"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          echo "✅ GitHub repo path works"

  validate-npm-package-path:
    name: Validate skills add (npm package)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build --workspace=packages/odoo-skills

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install skills tooling
        run: pip install skills-ref

      - name: Test discovery
        run: |
          set -e
          OUTPUT=$(npx -y skills add ./packages/odoo-skills --list 2>&1) || true
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "odoo"; then
            echo "  ✅ odoo skill detected in npm package"
          else
            echo "  ❌ odoo skill NOT detected in npm package"
            exit 1
          fi

      - name: Test installation
        run: |
          set -e
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.pi/agent"

          OUTPUT=$(npx -y skills add ./packages/odoo-skills --all 2>&1) || {
            echo "❌ skills add from npm package failed:"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          echo "✅ npm package path works"
