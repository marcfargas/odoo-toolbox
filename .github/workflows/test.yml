name: tests

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop
  workflow_dispatch:
    inputs:
      collect_logs:
        description: 'When to collect Docker logs'
        required: false
        default: 'on-failure'
        type: choice
        options:
          - 'on-failure'
          - 'always'
          - 'never'

jobs:
  setup:
    name: Setup & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache node_modules
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: packages/*/dist
          include-hidden-files: true
          retention-days: 1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Run linter
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unit

  integration-tests:
    name: Integration Tests (Odoo 17)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Start Docker services
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Run integration tests
        env:
          CI: 'true'
          ODOO_URL: http://localhost:8069
          ODOO_DB_NAME: odoo
          ODOO_DB_USER: admin
          ODOO_DB_PASSWORD: admin
        run: npm run test:integration

      - name: Collect Odoo logs
        if: (failure() && inputs.collect_logs != 'never') || inputs.collect_logs == 'always'
        run: docker compose -f docker-compose.test.yml logs odoo > odoo.log

      - name: Collect PostgreSQL logs
        if: (failure() && inputs.collect_logs != 'never') || inputs.collect_logs == 'always'
        run: docker compose -f docker-compose.test.yml logs postgres > postgres.log

      - name: Upload Docker logs
        if: (failure() && inputs.collect_logs != 'never') || inputs.collect_logs == 'always'
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: |
            odoo.log
            postgres.log
          retention-days: 90

      - name: Stop Docker services
        if: always()
        run: docker compose -f docker-compose.test.yml down

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: integration

  build-skills-zip:
    name: Build Skills Zip
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages

      - name: Build skills zip
        run: npm run build:skills-zip

      - name: Upload skills zip
        uses: actions/upload-artifact@v4
        with:
          name: odoo-skills
          path: dist/odoo-skills.zip
          retention-days: 30

  validate-skill-spec:
    name: Validate SKILL.md Files
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate SKILL.md (Agent Skills spec)
        run: |
          pip install skills-ref
          set -e
          for skill_md in $(find skills -name SKILL.md); do
            skill_dir=$(dirname "$skill_md")
            echo "Validating $skill_dir..."
            agentskills validate "$skill_dir"
          done
          echo "All SKILL.md files valid ✅"

  validate-github-repo-path:
    name: Validate skills add (GitHub repo)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install skills tooling
        run: pip install skills-ref

      - name: Test discovery
        run: |
          set -e
          OUTPUT=$(npx -y skills add . --list 2>&1) || true
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "odoo"; then
            echo "  ✅ odoo skill detected"
          else
            echo "  ❌ odoo skill NOT detected"
            exit 1
          fi

      - name: Test installation
        run: |
          set -e
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.pi/agent"

          OUTPUT=$(npx -y skills add . --all 2>&1) || {
            echo "❌ skills add from repo failed:"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          echo "✅ GitHub repo path works"

  validate-npm-package-path:
    name: Validate skills add (npm package)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run build --workspace=packages/odoo-skills

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install skills tooling
        run: pip install skills-ref

      - name: Test discovery
        run: |
          set -e
          OUTPUT=$(npx -y skills add ./packages/odoo-skills --list 2>&1) || true
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "odoo"; then
            echo "  ✅ odoo skill detected in npm package"
          else
            echo "  ❌ odoo skill NOT detected in npm package"
            exit 1
          fi

      - name: Test installation
        run: |
          set -e
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.pi/agent"

          OUTPUT=$(npx -y skills add ./packages/odoo-skills --all 2>&1) || {
            echo "❌ skills add from npm package failed:"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          echo "✅ npm package path works"
