name: Release

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish --provenance
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Register skills on skills.sh (docker-isolated)
        if: steps.changesets.outputs.published == 'true'
        run: |
          docker run --rm \
            -e HOME=/tmp/home \
            -w /tmp \
            node:24-bookworm \
            bash -lc '
              set -e
              apt-get update -qq && apt-get install -y -qq git >/dev/null
              mkdir -p "$HOME/.pi/agent"
              npx -y skills add marcfargas/odoo-toolbox --all
            ' 2>&1 || echo "⚠️ skills.sh registration failed (non-blocking)"
          echo "skills.sh registration done ✅"

  build-and-attach-skills-zip:
    name: Build and Attach Skills Zip
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build skills zip
        run: npm run build:skills-zip

      - name: Extract version from package.json
        id: version
        run: echo "version=v$(jq -r '.version' packages/odoo-skills/package.json)" >> $GITHUB_OUTPUT

      - name: Upload skills zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: dist/odoo-skills.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-published-skills:
    name: Validate Published Skills
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for GitHub to be updated
        run: |
          echo "Waiting 30s for GitHub repo to reflect latest commit..."
          sleep 30

      - name: Validate skills add marcfargas/odoo-toolbox (docker-isolated)
        run: |
          set -e

          echo "Testing (docker): skills add marcfargas/odoo-toolbox"

          OUTPUT=$(docker run --rm \
            -e HOME=/tmp/home \
            -w /tmp \
            node:24-bookworm \
            bash -lc '
              set -e
              apt-get update -qq && apt-get install -y -qq git >/dev/null
              mkdir -p "$HOME/.pi/agent"
              echo "--- discovery ---"
              npx -y skills add marcfargas/odoo-toolbox --list
              echo "--- install ---"
              npx -y skills add marcfargas/odoo-toolbox --all
            ' 2>&1) || {
              echo "❌ skills add failed"
              echo "$OUTPUT"
              exit 1
            }

          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "odoo"; then
            echo "  ✅ odoo skill discovered from GitHub repo"
          else
            echo "  ❌ odoo skill NOT found in GitHub repo"
            exit 1
          fi

          echo "  ✅ GitHub repo installs successfully"

      - name: Validation summary
        run: |
          echo ""
          echo "══════════════════════════════════════════════"
          echo "✅ Published skills validated"
          echo "══════════════════════════════════════════════"
          echo ""
          echo "Command tested: skills add marcfargas/odoo-toolbox"
          echo "Installation from GitHub repo works correctly!"
