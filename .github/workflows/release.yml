name: Release

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish --provenance
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Register skills on skills.sh
        if: steps.changesets.outputs.published == 'true'
        run: |
          npx -y skills add marcfargas/odoo-toolbox --full-depth --all 2>&1 || echo "⚠️ skills.sh registration failed (non-blocking)"
          echo "skills.sh registration done ✅"

  build-and-attach-skills-zip:
    name: Build and Attach Skills Zip
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Build skills zip
        run: npm run build:skills-zip

      - name: Extract version from package.json
        id: version
        run: echo "version=v$(jq -r '.version' packages/odoo-skills/package.json)" >> $GITHUB_OUTPUT

      - name: Upload skills zip to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: dist/odoo-skills.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-published-packages:
    name: Validate Published Packages
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for npm registry propagation
        run: |
          echo "Waiting 60s for npm registry to propagate..."
          sleep 60

      - name: Install skills tooling
        run: pip install skills-ref

      - name: Validate @marcfargas/odoo-skills from npmjs.com
        run: |
          set -e
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.pi/agent"

          echo "Testing: skills add @marcfargas/odoo-skills"
          
          # Discovery test
          OUTPUT=$(npx -y skills add @marcfargas/odoo-skills --list 2>&1) || {
            echo "❌ Discovery failed for @marcfargas/odoo-skills"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          
          if echo "$OUTPUT" | grep -qi "odoo"; then
            echo "  ✅ odoo skill discovered from published package"
          else
            echo "  ❌ odoo skill NOT found in published package"
            exit 1
          fi

          # Installation test
          OUTPUT=$(npx -y skills add @marcfargas/odoo-skills --all 2>&1) || {
            echo "❌ Installation failed for @marcfargas/odoo-skills"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          echo "  ✅ Published package installs successfully"

      - name: Validate marcfargas/odoo-toolbox from GitHub
        run: |
          set -e
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.pi/agent"

          echo "Testing: skills add marcfargas/odoo-toolbox"
          
          # Discovery test
          OUTPUT=$(npx -y skills add marcfargas/odoo-toolbox --full-depth --list 2>&1) || {
            echo "❌ Discovery failed for marcfargas/odoo-toolbox"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          
          if echo "$OUTPUT" | grep -qi "odoo"; then
            echo "  ✅ odoo skill discovered from GitHub repo"
          else
            echo "  ❌ odoo skill NOT found in GitHub repo"
            exit 1
          fi

          # Installation test
          OUTPUT=$(npx -y skills add marcfargas/odoo-toolbox --full-depth --all 2>&1) || {
            echo "❌ Installation failed for marcfargas/odoo-toolbox"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          echo "  ✅ GitHub repo installs successfully"

      - name: Validation summary
        run: |
          echo ""
          echo "══════════════════════════════════════════════"
          echo "✅ All published packages validated"
          echo "══════════════════════════════════════════════"
          echo ""
          echo "Tested installation paths:"
          echo "  1. npm package: skills add @marcfargas/odoo-skills"
          echo "  2. GitHub repo:  skills add marcfargas/odoo-toolbox"
          echo ""
          echo "Both paths work correctly!"
