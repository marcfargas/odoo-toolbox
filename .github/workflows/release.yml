name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['tests']
    types: [completed]
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npx changeset publish --provenance
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          HUSKY: '0'  # Disable pre-commit hooks — versioning bumps deps that aren't published yet

      - name: Register skills on skills.sh
        if: steps.changesets.outputs.published == 'true'
        run: |
          npx -y skills add marcfargas/odoo-toolbox --all 2>&1 || echo "⚠️ skills.sh registration failed (non-blocking)"
          echo "skills.sh registration done ✅"

  publish-docker:
    name: Publish Docker Image (odoo-mcp)
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get @marcfargas/odoo-mcp version
        id: version
        run: |
          VERSION=$(echo '${{ needs.release.outputs.publishedPackages }}' | \
            node -e "const p=JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')); \
              const pkg=p.find(x=>x.name==='@marcfargas/odoo-mcp'); \
              process.stdout.write(pkg?.version ?? '')")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.version.outputs.version != ''
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.version.outputs.version != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.version.outputs.version != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.version.outputs.version != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/marcfargas/odoo-mcp
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}

      - name: Build and push multi-arch image
        if: steps.version.outputs.version != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/odoo-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prune interim GHCR images
        # Policy:
        #   - Released images (any tag matching X.Y.Z semver) → keep forever
        #   - Interim/floating images (latest, develop, sha-*, etc.) → keep N=2
        #
        # This is a no-op today (only release tags exist) but is ready for
        # when develop-branch builds are added. packages: write includes delete
        # for packages linked to this repository.
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STALE=$(gh api "users/marcfargas/packages/container/odoo-mcp/versions" \
            --paginate \
            --jq '
              # Non-released = no X.Y.Z semver tag among its tags
              [.[] | select(
                all(.metadata.container.tags[]?;
                    test("^[0-9]+\\.[0-9]+\\.[0-9]+$") | not)
              )]
              | sort_by(.created_at) | reverse
              | .[2:]          # keep 2 most recent interim, delete the rest
              | .[].id
            ' 2>/dev/null || echo "")

          if [ -z "$STALE" ]; then
            echo "✅ No stale interim images to prune"
            exit 0
          fi

          echo "🗑️  Pruning stale interim image versions: $STALE"
          for id in $STALE; do
            gh api --method DELETE \
              "users/marcfargas/packages/container/odoo-mcp/versions/$id" \
              && echo "  deleted $id" \
              || echo "  ⚠️  Could not delete $id (non-blocking)"
          done

  validate-published-skills:
    name: Validate Published Skills
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wait for GitHub to be updated
        run: |
          echo "Waiting 30s for GitHub repo to reflect latest commit..."
          sleep 30

      - name: Install skills tooling
        run: pip install skills-ref

      - name: Validate skills add marcfargas/odoo-toolbox
        run: |
          set -e
          export HOME=$(mktemp -d)
          mkdir -p "$HOME/.pi/agent"

          echo "Testing: skills add marcfargas/odoo-toolbox"

          # Discovery test
          OUTPUT=$(npx -y skills add marcfargas/odoo-toolbox --list 2>&1) || {
            echo "❌ Discovery failed for marcfargas/odoo-toolbox"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "odoo"; then
            echo "  ✅ odoo skill discovered from GitHub repo"
          else
            echo "  ❌ odoo skill NOT found in GitHub repo"
            exit 1
          fi

          # Installation test
          OUTPUT=$(npx -y skills add marcfargas/odoo-toolbox --all 2>&1) || {
            echo "❌ Installation failed for marcfargas/odoo-toolbox"
            echo "$OUTPUT"
            exit 1
          }
          echo "$OUTPUT"
          echo "  ✅ GitHub repo installs successfully"

      - name: Validation summary
        run: |
          echo ""
          echo "══════════════════════════════════════════════"
          echo "✅ Published skills validated"
          echo "══════════════════════════════════════════════"
          echo ""
          echo "Command tested: skills add marcfargas/odoo-toolbox"
          echo "Installation from GitHub repo works correctly!"
